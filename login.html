<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录工作台 - 日程回声谷</title>
    <meta name="theme-color" content="#172026">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/schedule.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="loginTitle">
        <p class="eyebrow">日程回声谷 · 受邀工作台</p>
        <h1 id="loginTitle">登录个人求职工作台</h1>
        <p class="login-intro">这是个人主办、非经营性的求职计划与复盘工具。登录后可查看自己的日程、机会记录和面试复盘。</p>
        <form id="loginForm" class="login-form">
          <label>
            <span>用户名</span>
            <input id="loginUser" name="username" type="text" autocomplete="username" required>
          </label>
          <label>
            <span>密码</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button id="loginButton" class="primary-btn" type="submit">进入工作台</button>
        </form>
        <p id="loginMessage" class="login-message" aria-live="polite">请使用本机或服务器环境中配置的账号登录。</p>
        <div class="login-safety">
          <strong>安全边界</strong>
          <span>凭据只应配置在服务器环境变量中，不写入前端、APK、文档或日志。</span>
        </div>
        <div class="login-site-links" aria-label="网站信息">
          <a href="./">返回公开首页</a>
          <a href="./privacy.html">隐私政策</a>
          <a href="./terms.html">用户协议</a>
        </div>
        <p class="login-filing"><a href="https://beian.miit.gov.cn/" rel="noopener noreferrer">浙ICP备2026052607号</a><span aria-hidden="true"> · </span><span>公安联网备案申请准备中</span></p>
      </section>
    </main>
    <script src="assets/auth.js"></script>
  </body>
</html>
